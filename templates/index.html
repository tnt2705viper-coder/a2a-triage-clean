<!DOCTYPE html>
<html>
<head>
    <title>QUY TRÌNH NHẬN BỆNH A2A</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c75, #1b8a5a);
            margin:0;
            padding:10px;
        }

        .container {
            background:white;
            border-radius:16px;
            padding:18px;
            max-width:500px;
            margin:auto;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .logo {
            width:80px;
            display:block;
            margin:0 auto 6px auto;
        }

        h2 {
            text-align:center;
            font-size:22px;
            font-weight:700;
            margin-bottom:12px;
            color:#0f4c75;
            white-space:nowrap;
        }

        input[type="number"] {
            width:100%;
            padding:10px;
            margin:6px 0;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:16px;
        }

        .row-group {
            display:flex;
            gap:6px;
        }

        .row-group input {
            flex:1;
        }

        .bp-group {
            display:flex;
            gap:6px;
        }

        .bp-group input {
            flex:1;
        }

        h4 {
            font-size:14px;
            margin:10px 0 5px 0;
            color:#333;
        }

        label {
            font-size:15px;
            margin-right:12px;
        }

        .inline-options {
            display:flex;
            gap:15px;
            flex-wrap:wrap;
        }

        input[type="checkbox"],
        input[type="radio"] {
            transform:scale(1.2);
            margin-right:6px;
        }

        button {
            width:100%;
            padding:12px;
            margin-top:12px;
            border:none;
            border-radius:10px;
            font-weight:bold;
            background:linear-gradient(90deg,#1b8a5a,#0f4c75);
            color:white;
            font-size:16px;
        }

        .result {
            margin-top:15px;
            padding:12px;
            border-radius:10px;
            font-weight:bold;
            font-size:16px;
            white-space:pre-line;
        }

        .red { background:#d32f2f; color:white; }
        .yellow { background:#fbc02d; color:black; }
        .green { background:#388e3c; color:white; }
        .normal { background:#cccccc; color:black; }

    </style>
</head>

<body>

<div class="container">

    <img src="{{ url_for('static', filename='logo175.jpg') }}" class="logo">

    <h2>QUY TRÌNH NHẬN BỆNH KHOA A2A</h2>

    <form method="POST">

        <!-- MẠCH + SpO2 CÙNG HÀNG -->
        <div class="row-group">
            <input type="number" name="pulse" placeholder="Mạch (ECG)">
            <input type="number" name="spo2" placeholder="SpO2 (%)">
        </div>

        <!-- HUYẾT ÁP -->
        <div class="bp-group">
            <input type="number" name="systolic" placeholder="HA tâm thu">
            <input type="number" name="diastolic" placeholder="HA tâm trương">
        </div>

        <h4>Triệu chứng</h4>
        <div class="inline-options">
            <label><input type="checkbox" name="chest_pain"> Đau ngực/Khó thở</label>
        </div>

        <h4>Tri giác</h4>
        <!-- GLS 15 & <15 CÙNG HÀNG -->
        <div class="inline-options">
            <label><input type="radio" name="gcs" value="15"> GLS 15</label>
            <label><input type="radio" name="gcs" value="lt15"> GLS &lt;15</label>
        </div>

        <h4>ECG</h4>
        <div class="inline-options">
            <label><input type="checkbox" name="stemi"> STEMI</label>
        </div>

        <h4>Thuốc</h4>
        <div class="inline-options">
            <label><input type="checkbox" name="meds" value="dobutamin"> Dobutamin</label>
            <label><input type="checkbox" name="meds" value="noradrenalin"> Noradrenalin</label>
            <label><input type="checkbox" name="meds" value="nitroglycerin"> Nitroglycerin</label>
            <label><input type="checkbox" name="meds" value="insulin"> Insulin</label>
        </div>

        <h4>Oxy</h4>
        <div class="inline-options">
            <label><input type="radio" name="oxygen_type" value="nasal"> Oxy nhánh</label>
            <label><input type="radio" name="oxygen_type" value="mask"> Mask+</label>
        </div>

        <button type="submit">PHÂN LOẠI</button>
    </form>

    {% if result %}
    <div class="result {{ level }}">
        {{ result }}
    </div>
    {% endif %}

</div>

</body>
</html>
