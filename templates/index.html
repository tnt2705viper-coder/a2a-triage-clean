<!DOCTYPE html>
<html>
<head>
    <title>QUY TRÌNH NHẬN BỆNH KHOA A2A</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c75, #1b8a5a);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container {
            background:white;
            padding:25px;
            border-radius:18px;
            width:95%;
            max-width:420px;
            text-align:center;
            box-shadow:0 15px 35px rgba(0,0,0,0.25);
            position:relative;
        }

        .logo {
            width:80px;
            margin-bottom:10px;
        }

        h2 {
            margin:5px 0 20px 0;
            color:#0f4c75;
        }

        input[type="number"] {
            width:100%;
            padding:12px;
            margin:8px 0;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
            transition:0.2s;
        }

        input[type="number"]:focus {
            border-color:#1b8a5a;
            box-shadow:0 0 5px rgba(27,138,90,0.4);
            outline:none;
        }

        .bp-group {
            display:flex;
            align-items:center;
            gap:8px;
        }

        .bp-group input {
            width:45%;
        }

        .bp-group span {
            font-size:18px;
            font-weight:bold;
        }

        h4 {
            margin-top:15px;
            margin-bottom:8px;
            color:#333;
        }

        label {
            display:block;
            text-align:left;
            margin:6px 0;
            font-size:14px;
        }

        input[type="checkbox"] {
            margin-right:6px;
        }

        button {
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:12px;
            font-weight:bold;
            background:linear-gradient(90deg,#1b8a5a,#0f4c75);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover {
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        .result {
            margin-top:18px;
            padding:14px;
            border-radius:12px;
            font-weight:bold;
            font-size:18px;
        }

        .red { 
            background:#d32f2f; 
            color:white; 
            animation:shake 0.5s infinite;
        }

        .yellow { 
            background:#fbc02d; 
            color:black;
        }

        .green { 
            background:#388e3c; 
            color:white;
        }

        @keyframes shake {
            0%{transform:translateX(0);}
            25%{transform:translateX(-5px);}
            50%{transform:translateX(5px);}
            75%{transform:translateX(-5px);}
            100%{transform:translateX(0);}
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO BV175 -->
    <img src="{{ url_for('static', filename='logo175.jpg') }}" class="logo">

    <h2>QUY TRÌNH NHẬN BỆNH<br>KHOA A2A</h2>

    <form method="POST">

        <!-- MẠCH -->
        <input type="number" id="pulse" name="pulse" placeholder="Mạch"
               oninput="jumpNext(this, 'systolic', 3)">

        <!-- HUYẾT ÁP -->
        <div class="bp-group">
            <input type="number" id="systolic" name="systolic" 
                   placeholder="HA tâm thu"
                   oninput="jumpNext(this, 'diastolic', 3)">
            <span>/</span>
            <input type="number" id="diastolic" name="diastolic" 
                   placeholder="HA tâm trương"
                   oninput="jumpNext(this, 'spo2', 2)">
        </div>

        <!-- SPO2 -->
        <input type="number" id="spo2" name="spo2" placeholder="SpO2">

        <h4>Bệnh nhân đang sử dụng thuốc:</h4>

        <label><input type="checkbox" name="meds" value="dobutamin"> Dobutamin</label>
        <label><input type="checkbox" name="meds" value="noradrenalin"> Noradrenalin</label>
        <label><input type="checkbox" name="meds" value="nitroglycerin"> Nitroglycerin</label>
        <label><input type="checkbox" name="meds" value="insulin"> Insulin</label>
        <label><input type="checkbox" name="oxygen" value="yes"> Thở oxy</label>

        <button type="submit">PHÂN LOẠI</button>
    </form>

    {% if result %}
    <div class="result {{ level }}">
        {{ result }}
    </div>
    {% endif %}

</div>

<script>
function jumpNext(current, nextId, maxLength) {
    if (current.value.length >= maxLength) {
        document.getElementById(nextId).focus();
    }
}
</script>

</body>
</html>
